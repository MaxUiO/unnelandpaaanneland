<!doctype html>
<html lang="{{ site.lang | default: 'nb' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link href="https://fonts.cdnfonts.com/css/cesso-test" rel="stylesheet">      
  <link rel="icon" type="image/png" href="{{ 'assets/favicon.png' | relative_url }}">          
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav aria-label="Hovedmeny">
      {% for item in site.nav %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </header>
  <main id="main-content">{{ content }}</main>
  <footer class="site-footer">
    <span>{{ site.title }}</span>
    <span>Lørdag 17. Juli 2027</span>
  </footer>
</body>
</html>
